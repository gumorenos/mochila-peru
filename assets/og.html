<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink:     #1d2522;
    --muted:   #5f6d66;
    --paper:   #f7f4ee;
    --surface: #fffdf8;
    --line:    #d8d1c4;
    --signal:  #b8462c;
    --go:      #2f6f57;
    --amber:   #c77c1d;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px;
    overflow: hidden;
  }
  body {
    position: relative;
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .band {
    position: absolute;
    inset: 0 0 auto;
    height: 24px;
    background: linear-gradient(90deg, var(--signal) 0 32%, var(--amber) 32% 58%, var(--go) 58% 100%);
  }

  .frame {
    position: absolute; inset: 0;
    padding: 72px 86px 66px;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr auto;
    column-gap: 76px;
  }

  .brand {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .mark {
    width: 74px;
    height: 74px;
    display: block;
  }
  .wordmark {
    font-size: 58px;
    font-weight: 780;
    letter-spacing: 0;
    line-height: 1;
    color: var(--ink);
  }

  .headline {
    align-self: center;
    max-width: 730px;
  }
  .headline h1 {
    font-size: 72px;
    font-weight: 760;
    letter-spacing: 0;
    line-height: 1.02;
    color: var(--ink);
  }
  .headline p {
    margin-top: 24px;
    font-size: 31px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--muted);
    line-height: 1.34;
    max-width: 35ch;
  }

  .panel {
    align-self: center;
    border-left: 3px solid var(--line);
    padding-left: 34px;
  }

  .panel h2 {
    font-size: 25px;
    font-weight: 760;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats {
    margin-top: 28px;
    display: grid;
    gap: 22px;
  }

  .stat strong {
    display: block;
    font-size: 54px;
    line-height: 1;
    color: var(--ink);
  }

  .stat span {
    display: block;
    margin-top: 8px;
    font-size: 24px;
    color: var(--muted);
  }

  .chips {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    padding: 13px 19px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 23px;
    font-weight: 640;
    letter-spacing: 0;
    color: var(--ink);
  }
  .chip .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .chip .dot--red { background: var(--signal); }
  .chip .dot--amber { background: var(--amber); }
  .chip .dot--green { background: var(--go); }
</style>
</head>
<body>
  <div class="band"></div>

  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8 26V13.5L16 7l8 6.5V26" fill="none" stroke="#1d2522" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 16h10M11 21h10" fill="none" stroke="#b8462c" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M9.5 26h13" fill="none" stroke="#2f6f57" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">Mochila Perú</span>
    </div>

    <div class="headline">
      <h1>Checklist familiar de emergencia</h1>
      <p>Calcula qué preparar según tu zona, riesgos, hogar y días de autonomía.</p>
    </div>

    <div class="panel" aria-hidden="true">
      <h2>Perú</h2>
      <div class="stats">
        <p class="stat"><strong>38</strong><span>artículos sugeridos</span></p>
        <p class="stat"><strong>5</strong><span>zonas de riesgo</span></p>
        <p class="stat"><strong>100%</strong><span>local y privado</span></p>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot dot--red"></span>sismo</span>
      <span class="chip"><span class="dot dot--amber"></span>huaico</span>
      <span class="chip"><span class="dot dot--green"></span>offline</span>
      <span class="chip"><span class="dot dot--green"></span>imprimible</span>
    </div>
  </div>
</body>
</html>
